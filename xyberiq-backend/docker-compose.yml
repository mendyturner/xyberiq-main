version: "3.9"

services:
  api:
    build: .
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      XYBERIQ_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/xyberiq
      XYBERIQ_REDIS_URL: redis://redis:6379/0
      XYBERIQ_ENVIRONMENT: development
    depends_on:
      - db
      - redis
    working_dir: /code

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xyberiq
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
